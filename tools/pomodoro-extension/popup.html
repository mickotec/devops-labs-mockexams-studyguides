<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CKA & LFCS Study Pomodoro</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --cka: #326ce5;
      --cka-glow: rgba(50, 108, 229, 0.35);
      --lfcs: #e95420;
      --lfcs-glow: rgba(233, 84, 32, 0.35);
      --short-break: #22c55e;
      --long-break: #a855f7;
      --work-color: #EF4444; /* red */
      --break-color: #10B981; /* green */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg);
      color: var(--text);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
    }

    .title-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #38bdf8;
      text-decoration: underline;
      cursor: pointer !important;
      padding: 6px 10px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .title-link:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64748b;
      box-shadow: 0 0 6px rgba(100, 116, 139, 0.5);
    }
    .status-dot.active {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    /* Track buttons */
    .track-selector {
      display: flex;
      gap: 8px;
      background: var(--card);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    .track-btn {
      flex: 1;
      border: none;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .track-btn.active.cka {
      background: var(--cka);
      color: #fff;
      box-shadow: 0 2px 10px var(--cka-glow);
    }

    .track-btn.active.lfcs {
      background: var(--lfcs);
      color: #fff;
      box-shadow: 0 2px 10px var(--lfcs-glow);
    }

    /* Mode Buttons */
    .mode-toggle {
      display: flex;
      gap: 6px;
      background: var(--card);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .mode-btn {
      flex: 1;
      border: none;
      padding: 7px 0;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
    }

    .mode-btn.active {
      background: #334155;
      color: #f8fafc;
    }

    /* Main Timer Box */
    .timer-container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.25);
    }

    .mode-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    /* Timer digit color rules */
    .timer-digits {
      font-size: 56px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -1px;
    }

    .timer-digits.work {
      color: var(--work-color);
      text-shadow: 0 0 16px rgba(239, 68, 68, 0.4);
    }

    .timer-digits.break {
      color: var(--break-color);
      text-shadow: 0 0 16px rgba(16, 185, 129, 0.4);
    }

    /* Cycle indicator pills */
    .cycle-pills {
      display: flex;
      gap: 8px;
      margin: 6px 0;
    }

    .pill {
      width: 22px;
      height: 7px;
      border-radius: 4px;
      background: #334155;
      transition: all 0.3s;
    }

    .pill.filled {
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    .session-info {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Break Stats Counter */
    .break-stats {
      display: flex;
      justify-content: space-around;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    .break-label {
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .break-value {
      font-size: 16px;
      font-weight: 800;
      color: var(--break-color);
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: filter 0.15s;
    }

    .btn:hover {
      filter: brightness(1.1);
    }

    .btn-main {
      background: #38bdf8;
      color: #0f172a;
    }

    .btn-main.running {
      background: #f59e0b;
      color: #0f172a;
    }

    .btn-reset {
      background: #334155;
      color: #f8fafc;
      max-width: 80px;
    }

    /* History section */
    .history-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      max-height: 140px;
      overflow-y: auto;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .clear-btn {
      color: #ef4444;
      background: none;
      border: none;
      font-size: 11px;
      cursor: pointer;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: var(--text);
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .tag-work { color: #38bdf8; font-weight: 600; }
    .tag-short { color: #22c55e; font-weight: 600; }
    .tag-long { color: #a855f7; font-weight: 600; }

    /* Footer */
    .links-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--card-border);
      padding-top: 10px;
      font-size: 12px;
    }

    .link-item {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }
    .link-item:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="http://127.0.0.1:5050" target="_blank" id="titleLink" class="title-link" title="Open Study WebApp (http://127.0.0.1:5050)">
      🍅 CKA & LFCS Study Pomodoro ↗
    </a>
    <div id="statusDot" class="status-dot"></div>
  </div>

  <!-- CKA / LFCS Selector -->
  <div class="track-selector">
    <button id="ckaTab" class="track-btn active cka">☸️ CKA Focus</button>
    <button id="lfcsTab" class="track-btn lfcs">🐧 LFCS Focus</button>
  </div>

  <!-- Mode Selector -->
  <div class="mode-toggle">
    <button id="workModeBtn" class="mode-btn active">25m Focus</button>
    <button id="shortBreakBtn" class="mode-btn">5m Break</button>
    <button id="longBreakBtn" class="mode-btn">15m Long Break</button>
  </div>

  <!-- Timer Card -->
  <div class="timer-container">
    <div id="modeLabel" class="mode-label">CKA 25m Focus</div>
    <div id="timerDisplay" class="timer-digits">25:00</div>
    
    <!-- Visual 3-block cycle progress -->
    <div class="cycle-pills" id="cyclePills" title="Block 1, 2, 3 -> Long Break">
      <div class="pill" id="pill1"></div>
      <div class="pill" id="pill2"></div>
      <div class="pill" id="pill3"></div>
    </div>

    <div id="sessionStats" class="session-info">Today: 0 Focus Blocks</div>
  </div>

  <!-- Break Counter -->
  <div class="break-stats" id="breakStats">
    <div>
      <div class="break-label">Short Breaks</div>
      <div class="break-value" id="shortBreakCount">0</div>
    </div>
    <div>
      <div class="break-label">Long Breaks</div>
      <div class="break-value" id="longBreakCount">0</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button id="startBtn" class="btn btn-main">▶ Start Focus</button>
    <button id="resetBtn" class="btn btn-reset">↺ Reset</button>
  </div>

  <!-- History Log -->
  <div class="history-card">
    <div class="history-header">
      <span>Session History</span>
      <button id="clearHistoryBtn" class="clear-btn">Clear</button>
    </div>
    <div id="historyList">
      <div style="color: var(--text-muted); text-align: center; padding: 4px;">No completed sessions yet</div>
    </div>
  </div>

  <!-- Footer Quick Links -->
  <div class="links-footer">
    <a href="http://127.0.0.1:5050" target="_blank" class="link-item" id="openWebApp">Open Dashboard (127.0.0.1:5050) ↗</a>
    <a href="options.html" target="_blank" class="link-item" id="openSettingsLink">⚙️ Settings</a>
    <span style="color: #64748b;">EAT (UTC+3)</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
